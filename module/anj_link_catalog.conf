# anj_link_catalog.conf — anjcam 链接配方（SSOT，编译时导出到 out/manifest/link_catalog.conf）
#
# 行格式：
#   flag|<ENABLE_KEY>|<CMAKE_FLAG>
#   core_lib|<dir>|<pattern>|<required 0|1>
#   core_keep|<symbol> [更多符号...]
#   module|<ENABLE_KEY>|<dir|->|<pattern|->|<required 0|1>|<keeps 空格分隔或 ->|<attrs>
#
# module attrs（分号分隔，可空）：
#   parent=ENABLE_X     仅当父开关为 1 时生效
#   mutex=NAME          同组互斥，表顺序优先
#   or_with=ENABLE_Y    本开关或 Y 为 1 时链接库
#   keep_only=1         仅 keep，不链库（dir 写 -）
#
# 特殊逻辑仍在 anj_link_modules.sh：snap 核心始终链；platforms .a/.so 回退。

# ---------- ENABLE ↔ config.cmake ----------
flag|ENABLE_PTZ|MODULE_PTZ
flag|ENABLE_PTZ_PWM|MODULE_PTZ_PWM
flag|ENABLE_PTZ_DRV|MODULE_PTZ_DRV
flag|ENABLE_PTZ_IIC|MODULE_PTZ_IIC
flag|ENABLE_SDCARD|MODULE_SDCARD
flag|ENABLE_NFS|MODULE_NFS
flag|ENABLE_MCU|MODULE_MCU
flag|ENABLE_AOV|MODULE_AOV
flag|ENABLE_ZXING|MODULE_ZXING
flag|ENABLE_WAVE|MODULE_WAVE
flag|ENABLE_BATTERY|MODULE_BATTERY
flag|ENABLE_GYRO|MODULE_GYRO
flag|ENABLE_GYRO_ICM42607P|MODULE_GYRO_ICM42607P
flag|ENABLE_BLUETOOTH|MODULE_BLUETOOTH
flag|ENABLE_AUDIO|MODULE_MEDIA_AUDIO
flag|ENABLE_AAC|MODULE_MEDIA_AAC
flag|ENABLE_MP3|MODULE_MEDIA_MP3
flag|ENABLE_AEC|MODULE_AUDIO_ALGO_AEC
flag|ENABLE_OSD|MODULE_MEDIA_OSD
flag|ENABLE_SNAP_SOFT|MODULE_SNAP_SOFT
flag|ENABLE_SNAP_HARD|MODULE_SNAP_HARD
flag|ENABLE_SMART|MODULE_SMART
flag|ENABLE_SMART_MD|MODULE_SMART_MD
flag|ENABLE_SMART_PD|MODULE_SMART_PD
flag|ENABLE_SMART_FD|MODULE_SMART_FD
flag|ENABLE_SMART_PVD|MODULE_SMART_PVD
flag|ENABLE_GB28181|MODULE_SREVICE_28181
flag|ENABLE_ONVIF|MODULE_SREVICE_ONVIF
flag|ENABLE_ONVIF_SIMPLE|ONVIF_VERSION_SIMPLE
flag|ENABLE_ONVIF_FULL|ONVIF_VERSION_FULL
flag|ENABLE_HIK|MODULE_SREVICE_HIK
flag|ENABLE_RTSP_ENABLE|MODULE_SREVICE_RTSP_ENABLE
flag|ENABLE_RTSP|MODULE_SREVICE_RTSP
flag|ENABLE_RTSP_LITE|MODULE_SREVICE_RTSP_LITE
flag|ENABLE_ANJSER|MODULE_SREVICE_ANJSER
flag|ENABLE_AIOT|AIOT_SERVER
flag|ENABLE_ALI|ALI_SERVER
flag|ENABLE_CLOUD_STORAGE|MODULE_CLOUD_STORAGE
flag|ENABLE_CTCLOUD_STORAGE|CT_CLOUD_STORAGE
flag|ENABLE_AIOT_CLOUD_STORAGE|AIOT_CLOUD_STORAGE
flag|ENABLE_WEB|MODULE_SREVICE_ANJWEB
flag|ENABLE_H5LIVE|MODULE_SREVICE_H5LIVE
flag|ENABLE_RTMP|MODULE_SREVICE_RTMP
flag|ENABLE_HTTP|MODULE_SERVICE_HTTP
flag|ENABLE_FTPEMAIL|MODULE_SERVICE_FTPEMAIL
flag|ENABLE_HTTP_AUTO|MODULE_SERVICE_HTTP_AUTO
flag|ENABLE_WIRE|MODULE_NET_WIRE
flag|ENABLE_WIFI|MODULE_NET_WIFI
flag|ENABLE_4G|MODULE_NET_4G

# ---------- 始终链接的核心库 ----------
core_lib|lib/app|lib*.a|1
core_lib|lib/alarm|lib*.a|1
core_lib|lib/config|lib*.a|1
core_lib|lib/comm|lib*.a|1
core_lib|lib/factory|lib*.a|1
core_lib|lib/mbuf|lib*.a|1
core_lib|lib/media|lib*.a|1
