core_lib|lib/service/pri|lib*.a|1
core_lib|lib/sysmng|lib*.a|1
core_lib|lib/snap|lib*.a|1

# ---------- 始终 keep ----------
core_keep|anj_module_keep_anj_alarm anj_module_keep_anj_config anj_module_keep_anj_audio anj_module_keep_anj_video anj_module_keep_anj_osd anj_module_keep_anj_ispctl anj_module_keep_anj_net anj_module_keep_anj_sdcard anj_module_keep_anj_service anj_module_keep_anj_sysmng anj_module_keep_anj_snap

